    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=afb50a978ff0c09fc4421580c23968b6"></script>
    <script>
        var container = document.getElementById('map');
        var options = {
            center: new kakao.maps.LatLng(37.4899955, 126.75155),
            level: 1
        };
        var map = new kakao.maps.Map(container, options);
        var markerPosition = new kakao.maps.LatLng(37.4899955, 126.75155);
        var marker = new kakao.maps.Marker({
            position:markerPosition,
        })
        
        var infowindow = new kakao.maps.InfoWindow({
            content: '<div style="width:150px;text-align:center;padding:6px 0;">복사골장애인자립생활지원센터</div>'
        });
        infowindow.open(map, marker);
        marker.setMap(map);
    </script>
